name: Build PDF

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          compiler: xelatex
          args: "-interaction=nonstopmode -file-line-error"
        continue-on-error: true

      - name: Remove stale resume artifact (re-run safety)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "resume") | .id' \
          | while read -r id; do
              echo "Deleting stale artifact $id"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            done

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Remove stale github-pages artifacts (re-run safety)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
          | while read -r id; do
              echo "Deleting stale artifact $id"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            done

      - name: Download PDF Artifact
        uses: actions/download-artifact@v4
        with:
          name: resume
          path: ./public

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
